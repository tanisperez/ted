"git.failure.rejected_text":
  en: "%{upstream} has commits you do not have. Pull them first, then push again."
  es: "%{upstream} tiene commits que no tienes. Haz pull primero y luego vuelve a hacer push."
"git.failure.rejected_text_plain":
  en: "The remote has commits you do not have. Pull them first, then push again."
  es: "El remoto tiene commits que no tienes. Haz pull primero y luego vuelve a hacer push."
"git.failure.auth_text":
  en: "The remote refused the credentials. ted uses git's credential helper or SSH agent: check that they work in a terminal."
  es: "El remoto rechazó las credenciales. ted usa el gestor de credenciales de git o el agente SSH: comprueba que funcionan en un terminal."
"git.failure.no_author_text":
  en: "Git does not know who you are. Set user.name and user.email with git config."
  es: "Git no sabe quién eres. Configura user.name y user.email con git config."
"git.failure.nothing_text":
  en: "There is nothing staged to commit."
  es: "No hay nada preparado para el commit."
"git.failure.conflicts_text":
  en: "Some files have conflicts. Resolve them in an external tool, then commit."
  es: "Algunos archivos tienen conflictos. Resuélvelos con una herramienta externa y luego haz commit."
"git.failure.network_text":
  en: "The remote could not be reached. Check the connection and try again."
  es: "No se pudo conectar con el remoto. Comprueba la conexión y vuelve a intentarlo."
"git.failure.hook_text":
  en: "A git hook stopped the operation. Its output says why."
  es: "Un hook de git detuvo la operación. Su salida explica el motivo."
"git.failure.not_merged_text":
  en: "The branch has commits that are not merged anywhere else."
  es: "La rama tiene commits que no están fusionados en ninguna otra."
"git.failure.local_changes_text":
  en: "Your uncommitted changes would be overwritten. Commit them or stash them first."
  es: "Se sobrescribirían tus cambios sin commit. Haz commit o guárdalos con stash primero."
"git.failure.other_text":
  en: "Git reported an error. Its output says why."
  es: "Git informó de un error. Su salida explica el motivo."
"git.failure.show_output":
  en: "Show git output"
  es: "Ver la salida de git"
"git.failure.output_title":
  en: "Git output"
  es: "Salida de git"
