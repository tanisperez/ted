name: Release

# Builds and packages ted for every platform when a version tag is pushed and attaches the
# packages to the GitHub release of that tag. The release is normally created by hand as a draft
# with its notes right after pushing the tag; this workflow creates the draft itself if it is
# missing, and publishes it only once every asset is uploaded. See docs/releasing.md.
#
# Run by hand (workflow_dispatch) it is a dry run: it builds every package from the branch and
# keeps them as the run's artifacts, without touching any release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      # The tag must be `v` plus the workspace version, optionally followed by a pre-release
      # suffix (`v0.1.0-rc.1` for version 0.1.0). Tags with a suffix become pre-releases. A dry
      # run takes the workspace version as it is.
      - name: Compare the tag with the workspace version
        id: version
        run: |
          cargo_version=$(awk -F'"' '
            /^\[workspace\.package\]/ { section = 1; next }
            /^\[/ { section = 0 }
            section && /^version *=/ { print $2; exit }
          ' Cargo.toml)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
            base="${version%%-*}"
            if [ "$base" != "$cargo_version" ] && [ "$version" != "$cargo_version" ]; then
              echo "::error::Tag $tag does not match the workspace version $cargo_version"
              exit 1
            fi
          else
            version="$cargo_version"
            base="${version%%-*}"
          fi
          if [ "$version" != "$base" ]; then prerelease=true; else prerelease=false; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Version $version, pre-release: $prerelease"

  build:
    name: Build ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          # 22.04 (glibc 2.35) so the binary also runs on Debian 12 and older Ubuntu LTS.
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake \
            libfontconfig-dev libfreetype-dev \
            libwayland-dev wayland-protocols \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev \
            libvulkan-dev
          # bsdtar and zstd write the Arch package (packaging/linux/package.sh).
          sudo apt-get install -y libarchive-tools zstd

      # No Cargo cache: release builds are rare, and the Build workflow's Linux cache comes from a
      # newer Ubuntu whose glibc the build scripts restored here could need.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Tarball, deb, rpm and Arch package (packaging/linux).
      - name: Package for Linux
        if: runner.os == 'Linux'
        env:
          NFPM_VERSION: 2.47.0
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/nfpm"
          curl -sSfL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/nfpm" nfpm
          PATH="$RUNNER_TEMP/nfpm:$PATH" packaging/linux/package.sh "$VERSION" \
            "target/${{ matrix.target }}/release/ted" dist

      # AppImage (packaging/linux/appimage.sh). appimagetool and the type2 runtime are pinned, and
      # appimagetool runs extracted, since the runner has no FUSE 2.
      - name: Package the AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGETOOL_VERSION: 1.9.1
          RUNTIME_VERSION: "20251108"
          APPIMAGE_EXTRACT_AND_RUN: 1
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/appimage"
          curl -sSfLo "$RUNNER_TEMP/appimage/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          curl -sSfLo "$RUNNER_TEMP/appimage/runtime-x86_64" \
            "https://github.com/AppImage/type2-runtime/releases/download/${RUNTIME_VERSION}/runtime-x86_64"
          chmod +x "$RUNNER_TEMP/appimage/appimagetool"
          PATH="$RUNNER_TEMP/appimage:$PATH" APPIMAGE_RUNTIME="$RUNNER_TEMP/appimage/runtime-x86_64" \
            packaging/linux/appimage.sh "$VERSION" "target/${{ matrix.target }}/release/ted" dist

      # ted.app as .dmg and .app.tar.gz (packaging/macos).
      - name: Package for macOS
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          packaging/macos/bundle.sh "$VERSION" "target/${{ matrix.target }}/release/ted" dist

      # Per-user Inno Setup installer (packaging/windows).
      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc /Q "/DAppVersion=$env:VERSION" `
            "/DSourceExe=$PWD\target\${{ matrix.target }}\release\ted.exe" `
            "/DOutputDir=$PWD\dist" packaging\windows\ted.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Portable zip, for machines where running an installer is not allowed. Entries sit at the
      # top level of the zip.
      - name: Package the portable zip for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = Join-Path $PWD "dist\ted-$env:VERSION-windows-x86_64-portable.zip"
          Compress-Archive -Force -DestinationPath $zip -Path `
            "target\${{ matrix.target }}\release\ted.exe", 'LICENSE', 'NOTICE'
          Get-Item $zip | Format-List Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ted-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [check, build]
    # Only for a tag: a dry run keeps the packages as the run's artifacts.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Every platform must be there before anything is published.
      - name: Check the packages
        working-directory: dist
        run: |
          for pattern in 'ted-*-macos-arm64.dmg' 'ted-*-windows-x86_64-setup.exe' \
            'ted-*-windows-x86_64-portable.zip' 'ted_*_amd64.deb' 'ted-*.x86_64.rpm' \
            'ted-*-x86_64.pkg.tar.zst' 'ted-*-x86_64.AppImage' 'ted-*-linux-x86_64.tar.gz'; do
            if ! ls $pattern > /dev/null 2>&1; then
              echo "::error::Missing $pattern in dist"
              exit 1
            fi
          done

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # `gh release view` also finds draft releases by their tag.
      - name: Create the draft release if missing
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" \
              --notes "Release notes for $TAG are pending."
          fi

      - name: Upload assets
        run: gh release upload "$TAG" dist/* --clobber

      - name: Publish
        run: |
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
