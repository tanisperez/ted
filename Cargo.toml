[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.7.0-dev"
publish = false
license = "Apache-2.0"
authors = ["Estanislao Pérez Nartallo <tanisperez@gmail.com>"]

[workspace.dependencies]
gpui-kit = "0.9.1"
# The design system and standard components shared with Postino, Vano and Nastro. Same gpui-kit pin.
telaio-ui = { git = "https://github.com/tanisperez/telaio", tag = "v0.23.3" }
# The application shell: logging, command line pieces, language, numbers, paths, window bootstrap.
telaio-app = { git = "https://github.com/tanisperez/telaio", tag = "v0.23.3" }
# The git client shared with Postino: drives the `git` executable, no gpui.
telaio-git = { git = "https://github.com/tanisperez/telaio", tag = "v0.23.3" }
serde = "1"
serde_json = "1"
thiserror = "2"
anyhow = "1"
pretty_assertions = "1.4"
fastrand = "2"
tempfile = "3"
dirs = "7"
toml = "0.8"
log = "0.4"
# Already built by gpui-component (translations); same version.
rust-i18n = "4.2"
# The editor (telaio-editor), its buffer (telaio-text) and its highlighting (telaio-syntax, every
# grammar and the Markdown preview), moved from ted to telaio for Postino #258.
telaio-editor = { git = "https://github.com/tanisperez/telaio", tag = "v0.23.3" }
telaio-text = { git = "https://github.com/tanisperez/telaio", tag = "v0.23.3" }
telaio-syntax = { git = "https://github.com/tanisperez/telaio", tag = "v0.23.3", features = ["all-languages", "markdown-preview"] }
# Folder explorer: gitignore matching, file watching and the batched channel. The exact versions
# gpui already builds.
ignore = "0.4.33"
# The version `ignore` already builds, for the file mask of Find in files.
globset = "0.4.20"
notify = "8.2"
async-channel = "2.5"

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"

# As in Postino: fat LTO, one codegen unit and stripped, measured there as the best size and RSS
# for no runtime cost. Panics stay as unwind.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# gpui and the other dependencies are far too slow unoptimized (see Postino #34). Optimizing only
# the dependencies keeps the UI usable in debug builds while the workspace's own crates stay quick
# to rebuild and debug.
[profile.dev.package."*"]
opt-level = 2

