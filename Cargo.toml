[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.2.0-dev"
publish = false
license = "Apache-2.0"
authors = ["Estanislao Pérez Nartallo <tanisperez@gmail.com>"]

[workspace.dependencies]
gpui-kit = "0.8.0"
# The design system and standard components shared with Postino, Vano and Nastro. Same gpui-kit pin.
telaio-ui = { git = "https://github.com/tanisperez/telaio", tag = "v0.9.1" }
# The application shell: logging, command line pieces, language, numbers, paths, window bootstrap.
telaio-app = { git = "https://github.com/tanisperez/telaio", tag = "v0.9.1" }
serde = "1"
serde_json = "1"
thiserror = "2"
anyhow = "1"
pretty_assertions = "1.4"
fastrand = "2"
tempfile = "3"
dirs = "7"
toml = "0.8"
log = "0.4"
# Already built by gpui-component (translations); same version.
rust-i18n = "4.2"
# The rope of the text buffer, the exact version and features gpui-component already builds.
ropey = { version = "=2.0.0-beta.1", features = ["metric_chars", "metric_lines_lf", "metric_utf16"] }
# Syntax highlighting: the exact tree-sitter and grammar versions gpui-component 0.8.0 pins.
tree-sitter = "=0.26.13"
tree-sitter-rust = "=0.24.0"
tree-sitter-javascript = "=0.23.1"
tree-sitter-json = "=0.24.8"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-md = "=0.5.1"
tree-sitter-html = "=0.23.2"
# Not built by gpui-component by default, but the version it pins behind its `tree-sitter-make`
# feature.
tree-sitter-make = "=1.1.1"
# Find in file: a literal searched with the case rules of Unicode. The version gpui already builds.
regex = "1.13"
# Folder explorer: gitignore matching, file watching and the batched channel. The exact versions
# gpui already builds.
ignore = "0.4.33"
notify = "8.2"
async-channel = "2.5"

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"

# As in Postino: fat LTO, one codegen unit and stripped, measured there as the best size and RSS
# for no runtime cost. Panics stay as unwind.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# gpui and the other dependencies are far too slow unoptimized (see Postino #34). Optimizing only
# the dependencies keeps the UI usable in debug builds while the workspace's own crates stay quick
# to rebuild and debug.
[profile.dev.package."*"]
opt-level = 2
